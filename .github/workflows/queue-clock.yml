name: queue clock

# Independent watchdog for the queue's Cloudflare scheduler.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-the-clock:
    runs-on: ubuntu-latest
    steps:
      - name: Ask thwip when it last moved
        run: |
          set -euo pipefail
          health=$(curl -fsS https://thwip.ai/health)
          echo "$health" | jq .
          age=$(echo "$health" | jq -r '.tick.ageSeconds // empty')
          if [ -z "$age" ]; then
            echo "::error::/health reported no tick age, so the live build predates the queue clock"
            exit 1
          fi
          if [ "$age" -gt 900 ]; then
            echo "::error::the queue has not finished a tick in ${age}s"
            cause=$(echo "$health" | jq -r '.tick.lastError // empty')
            if [ -n "$cause" ]; then
              echo "::error::the last tick threw at $(echo "$health" | jq -r '.tick.lastErrorAt'): ${cause}"
            else
              echo "::error::no tick has thrown, so the trigger is not firing rather than failing"
            fi
            exit 1
          fi
          echo "last tick ${age}s ago, by $(echo "$health" | jq -r '.tick.source')"

          # Keep break-glass deployments visible until a normal deploy replaces them.
          exception=$(echo "$health" | jq -r '.exception // empty')
          if [ -n "$exception" ]; then
            echo "$exception" | jq .
            echo "::error::production is running a break-glass deploy: $(echo "$exception" | jq -r '.reason')"
            echo "::error::deployed from $(echo "$exception" | jq -r '.tree') at $(echo "$exception" | jq -r '.at'), excusing $(echo "$exception" | jq -r '.guards | join(", ")')"
            exit 1
          fi
