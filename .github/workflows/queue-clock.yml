name: queue clock

# Cloudflare stopped dispatching thwip's own five minute trigger at 03:55Z on
# 5 August, with the schedule still listed by its own API and no error recorded
# against it. Eleven hours passed before anybody noticed, and what noticed was a
# person comparing invocation counts against webhook rows by hand.
#
# This reads the age of the last finished tick from a scheduler that is not
# Cloudflare's, and the request it makes is itself traffic, which is the queue's
# second clock. Two vendors now have to stop for the queue to stop quietly.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-the-clock:
    runs-on: ubuntu-latest
    steps:
      - name: Ask thwip when it last moved
        run: |
          set -euo pipefail
          health=$(curl -fsS https://thwip.recall.net/health)
          echo "$health" | jq .
          age=$(echo "$health" | jq -r '.tick.ageSeconds // empty')
          if [ -z "$age" ]; then
            echo "::error::/health reported no tick age, so the live build predates the queue clock"
            exit 1
          fi
          if [ "$age" -gt 900 ]; then
            echo "::error::the queue has not finished a tick in ${age}s"
            # What stopped it, when the Worker knows. An age on its own is what
            # cost eleven hours on 5 August: the clock said how long, and finding
            # out why meant reading invocation analytics against webhook rows by
            # hand.
            cause=$(echo "$health" | jq -r '.tick.lastError // empty')
            if [ -n "$cause" ]; then
              echo "::error::the last tick threw at $(echo "$health" | jq -r '.tick.lastErrorAt'): ${cause}"
            else
              echo "::error::no tick has thrown, so the trigger is not firing rather than failing"
            fi
            exit 1
          fi
          echo "last tick ${age}s ago, by $(echo "$health" | jq -r '.tick.source')"

          # A break-glass deploy is unreviewed code in production, and the only
          # thing that reliably ends one is somebody being reminded. On 9 August
          # the queue could not merge its own repair, the repair went out from a
          # branch, and nothing outside one terminal knew. An ordinary deploy
          # from main clears the stamp, so this goes quiet by itself once the
          # tree it excused has merged and shipped the usual way.
          exception=$(echo "$health" | jq -r '.exception // empty')
          if [ -n "$exception" ]; then
            echo "$exception" | jq .
            echo "::error::production is running a break-glass deploy: $(echo "$exception" | jq -r '.reason')"
            echo "::error::deployed from $(echo "$exception" | jq -r '.tree') at $(echo "$exception" | jq -r '.at'), excusing $(echo "$exception" | jq -r '.guards | join(", ")')"
            exit 1
          fi
