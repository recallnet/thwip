name: thwip

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  id-token: write

jobs:
  thwip:
    name: thwip
    runs-on: ubuntu-latest
    steps:
      # Check out the workflow's own pinned revision — never the PR head.
      # Proof verification must not execute PR-controlled code.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify thwip proof for the exact PR head commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THWIP_ENDPOINT: https://thwip.recall.net
        run: node packages/action/dist/index.cjs
