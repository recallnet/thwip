name: thwip

run-name: >-
  thwip: verify proof for PR #${{ github.event.pull_request.number }} —
  ${{ github.event.pull_request.title }}

on:
  pull_request:

permissions:
  contents: read
  id-token: write
  checks: write
  pull-requests: read

jobs:
  thwip:
    name: thwip / workflow
    runs-on: ubuntu-latest
    steps:
      - name: Verify the proof and join Thwip Queue
        uses: recallnet/thwip@c9e23c740ffe7d7f30123e829787647443007f7b
