name: thwip

run-name: >-
  thwip: verify proof for PR #${{ github.event.pull_request.number }} —
  ${{ github.event.pull_request.title }}

on:
  pull_request:

permissions:
  contents: read
  id-token: write
  checks: write
  pull-requests: read

jobs:
  thwip:
    name: thwip / workflow
    runs-on: ubuntu-latest
    steps:
      # Run the Action from the workflow revision, not pull-request code.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify the proof and join Thwip Queue
        uses: ./
