name: thwip-drain

run-name: "thwip: nudge an idle queue lane"

# Wake a queue lane whose offered turn has nobody left to drive it.
#
# Pull requests are enrolled from GitHub App deliveries now, and queue
# authorization is deliberately non-fatal to the proof check. A queue outage no
# longer leaves a failed required check behind. Re-running failed proof checks
# here would only retry real proof refusals, including records for pull requests
# that have already merged. The scheduled job therefore nudges the queue and
# nothing else.
on:
  schedule:
    # Off the hour on purpose. Every scheduled workflow in the world fires at :00.
    - cron: "23,53 * * * *"
  workflow_dispatch:

# Only what the health check and authenticated nudge use.
permissions:
  contents: read
  # The nudge endpoint drives GitHub Actions on the repository it names, so it
  # asks who is calling. A scheduled job holds no session; an Actions OIDC token
  # is the identity it does have, and it names this repository.
  id-token: write

concurrency:
  group: thwip-drain
  cancel-in-progress: false

jobs:
  drain:
    name: drain
    runs-on: ubuntu-latest
    steps:
      - name: Nudge the queue after an idle offer
        env:
          THWIP_ENDPOINT: https://thwip.recall.net
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          set -uo pipefail

          # Ask the queue whether it is healthy before touching anything. This
          # reads the projection, so it costs no Durable Object request and is
          # safe to run every half hour forever, including while the queue is down.
          q=$(curl -sS -w '\n%{http_code}' \
            "$THWIP_ENDPOINT/v1/queue/$REPO_ID?ref=refs%2Fheads%2Fmain" || true)
          code=$(printf '%s' "$q" | tail -n1)
          if [ "$code" != "200" ] && [ "$code" != "401" ]; then
            echo "queue is not answering (http $code); nothing to drain yet"
            exit 0
          fi

          # A lane the object's alarm offered has nobody telling it. The alarm runs
          # inside the object, which cannot reach GitHub, so without this the turn
          # sits idle until an unrelated request happens to move it. Reads the
          # projection and wakes no object, so it is free to call every half hour.
          oidc() {
            curl -sS -H "authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${THWIP_ENDPOINT}/api/github-actions" | jq -r .value
          }

          n=$(curl -sS -X POST -H "authorization: Bearer $(oidc)" \
            "$THWIP_ENDPOINT/v1/queue/$REPO_ID/nudge?ref=refs%2Fheads%2Fmain" || true)
          echo "nudge: $n"
