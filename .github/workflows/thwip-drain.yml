name: thwip-drain

run-name: "thwip: drain pull requests blocked by a queue outage"

# Re-drive pull requests whose thwip check failed because the queue was down.
#
# A refusal and an outage look identical to GitHub: both are a red check that
# stays red until someone re-runs it. So a transient queue failure stopped every
# merge in the repository and stayed stopped, waiting for a human. That is not a
# durable queue, it is a queue with a person standing behind it.
#
# This closes that. It only acts when the queue is answering again, it only
# re-runs checks that already failed, and it leaves the decision entirely to the
# queue: a pull request that genuinely does not hold the turn fails again, which
# is the correct answer.
on:
  schedule:
    # Off the hour on purpose. Every scheduled workflow in the world fires at :00.
    - cron: "23,53 * * * *"
  workflow_dispatch:

# Only what it uses. The pull request API is unreachable with GITHUB_TOKEN on this
# repository, and asking for a permission that does nothing is a claim about what
# this job touches that is not true.
permissions:
  contents: read
  actions: write

concurrency:
  group: thwip-drain
  cancel-in-progress: false

jobs:
  drain:
    name: drain
    runs-on: ubuntu-latest
    steps:
      - name: Re-run thwip checks the queue can now answer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THWIP_ENDPOINT: https://thwip.recall.net
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          set -uo pipefail

          # Ask the queue whether it is healthy before touching anything. This
          # reads the projection, so it costs no Durable Object request and is
          # safe to run every half hour forever, including while the queue is down.
          q=$(curl -sS -w '\n%{http_code}' \
            "$THWIP_ENDPOINT/v1/queue/$REPO_ID?ref=refs%2Fheads%2Fmain" || true)
          code=$(printf '%s' "$q" | tail -n1)
          if [ "$code" != "200" ] && [ "$code" != "401" ]; then
            echo "queue is not answering (http $code); nothing to drain yet"
            exit 0
          fi

          # A lane the object's alarm offered has nobody telling it. The alarm runs
          # inside the object, which cannot reach GitHub, so without this the turn
          # sits idle until an unrelated request happens to move it. Reads the
          # projection and wakes no object, so it is free to call every half hour.
          n=$(curl -sS -X POST "$THWIP_ENDPOINT/v1/queue/$REPO_ID/nudge?ref=refs%2Fheads%2Fmain" || true)
          echo "nudge: $n"

          # The Actions API only. GITHUB_TOKEN cannot reach the pull request API
          # on this repository, through gh pr list or through REST, so the drain
          # asks about workflow runs instead: which thwip runs failed, and re-run
          # them. It never needs to know a pull request number.
          cutoff=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-30M +%Y-%m-%dT%H:%M:%SZ)
          echo "re-running thwip runs that failed before $cutoff"

          runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/thwip-required.yml/runs?status=failure&event=pull_request&per_page=30" \
            --jq ".workflow_runs[] | select(.updated_at < \"$cutoff\") | \"\(.id) \(.head_branch)\"" || true)

          if [ -z "$runs" ]; then
            echo "nothing failed long enough ago to re-drive"
            exit 0
          fi

          # One re-run per branch: a branch with several failed runs only needs its
          # most recent one, and re-running the older ones would spend Actions
          # minutes proving the same thing.
          seen=""
          printf '%s\n' "$runs" | while read -r id branch; do
            [ -n "$id" ] || continue
            case " $seen " in *" $branch "*) continue ;; esac
            seen="$seen $branch"
            if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/rerun-failed-jobs" >/dev/null 2>&1; then
              echo "re-ran thwip for $branch (run $id)"
            else
              echo "could not re-run $branch (run $id)"
            fi
          done
