name: thwip-merge

# The merge Thwip Queue authorized.
#
# This cannot live inside the `thwip` job: that job *is* the required check, so the
# branch cannot be mergeable while it is still running. GitHub answers 405 and the
# queue would appear to be refusing when it had in fact authorized. So the merge
# waits for that workflow to conclude and then runs here.
#
# workflow_run executes in the base branch's context with the base branch's code,
# never the pull request's, which is what makes it safe to hold a token that can
# write.

on:
  workflow_run:
    workflows: [thwip]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  # Run the required suites against the integrated candidate — the merge commit
  # that will actually land — and tell the queue what happened.
  #
  # This runs here rather than in a workflow of its own because workflow_run
  # already gives the property that matters: it executes the default branch's copy
  # of this file, in the base branch's context, so a pull request cannot edit the
  # thing that judges it. Only the code under test comes from the candidate.
  verify-candidate:
    name: verify candidate
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Resolve the candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
                 --jq '[.[] | select(.state=="open")][0] // empty')
          if [ -z "$pr" ]; then
            echo "::notice::no open pull request for $HEAD_SHA"
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PR=$(printf '%s' "$pr" | jq -r .number)
          merge_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.merge_commit_sha // empty')
          if [ -z "$merge_sha" ]; then
            echo "::notice::GitHub has not produced a merge commit yet"
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge_sha" --jq .tree.sha)
          {
            echo "skip=0"
            echo "pr=$PR"
            echo "base_ref=refs/heads/$(printf '%s' "$pr" | jq -r .base.ref)"
            echo "base_sha=$(printf '%s' "$pr" | jq -r .base.sha)"
            echo "candidate_sha=$merge_sha"
            echo "candidate_tree=$tree"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: steps.candidate.outputs.skip == '0'
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.candidate.outputs.skip == '0'
        with:
          node-version: 24

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        if: steps.candidate.outputs.skip == '0'

      # Confirm the checkout is the tree the queue will be told about, before
      # running anything. Reporting on a different tree is worse than not running.
      - name: Confirm the candidate tree
        if: steps.candidate.outputs.skip == '0'
        env:
          EXPECTED_TREE: ${{ steps.candidate.outputs.candidate_tree }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD^{tree})
          echo "candidate tree: $actual (expected $EXPECTED_TREE)"
          [ "$actual" = "$EXPECTED_TREE" ] || {
            echo "::error::checked out tree is not the pinned candidate"; exit 1; }

      - name: Install
        if: steps.candidate.outputs.skip == '0'
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve to their built types, so typecheck cannot run
      # from a clean checkout until they exist. A developer's tree already has
      # them, which is why only a clean-room run of the candidate ever noticed.
      - name: Build workspace packages
        if: steps.candidate.outputs.skip == '0'
        run: pnpm build

      # One suite at a time, so the verdict can say which one failed rather than
      # reporting a single opaque failure.
      - name: Run required suites
        id: suites
        if: steps.candidate.outputs.skip == '0'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -uo pipefail
          results='[]'
          overall=0
          for suite in lint typecheck test; do
            start=$(date +%s%3N)
            if pnpm run "$suite"; then outcome=passed; else outcome=failed; overall=1; fi
            end=$(date +%s%3N)
            echo "suite $suite: $outcome ($((end - start))ms)"
            results=$(jq -c --arg n "$suite" --arg o "$outcome" --argjson d "$((end - start))" \
              '. + [{name:$n, outcome:$o, durationMs:$d}]' <<< "$results")
          done
          {
            echo "suites=$results"
            echo "accepted=$([ "$overall" -eq 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      # Reported even when the suites failed: a refusal the queue never hears is a
      # pull request that waits forever.
      - name: Report the verdict to Thwip Queue
        if: always() && steps.candidate.outputs.skip == '0' && steps.suites.outcome != 'skipped'
        env:
          THWIP_ENDPOINT: https://thwip.recall.net
          REPO_ID: ${{ github.event.repository.id }}
          SUITES: ${{ steps.suites.outputs.suites }}
          ACCEPTED: ${{ steps.suites.outputs.accepted }}
          PR: ${{ steps.candidate.outputs.pr }}
          BASE_REF: ${{ steps.candidate.outputs.base_ref }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.candidate_tree }}
        run: |
          set -uo pipefail
          raw=$(curl -sS -w '\n%{http_code}' \
            -H "authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${THWIP_ENDPOINT}/api/github-actions" || true)
          code=$(printf '%s' "$raw" | tail -n1)
          oidc=$(printf '%s' "$raw" | sed '$d' | jq -r '.value // empty')
          if [ "$code" != "200" ] || [ -z "$oidc" ]; then
            echo "::error::could not obtain an OIDC token (http $code)"; exit 1
          fi

          accepted="${ACCEPTED:-false}"
          reasons='[]'
          [ "$accepted" = "true" ] || reasons='["SUITE_NOT_PASSED"]'

          body=$(jq -nc --arg base "$BASE_REF" --argjson pr "$PR" \
            --arg bsha "$BASE_SHA" --arg csha "$CANDIDATE_SHA" --arg tree "$CANDIDATE_TREE" \
            --argjson accepted "$accepted" --argjson suites "${SUITES:-[]}" --argjson reasons "$reasons" \
            '{baseRef:$base, pullRequestNumber:$pr, baseSha:$bsha, candidateSha:$csha,
              candidateTreeOid:$tree, accepted:$accepted, suites:$suites, reasonCodes:$reasons}')

          out=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "authorization: Bearer $oidc" -H "content-type: application/json" \
            -d "$body" "$THWIP_ENDPOINT/v1/queue/$REPO_ID/candidate-result" || true)
          rcode=$(printf '%s' "$out" | tail -n1)
          echo "candidate-result: http $rcode"
          printf '%s\n' "$out" | sed '$d'
          [ "$rcode" = "202" ] || {
            echo "::error::Thwip Queue did not accept the candidate verdict (http $rcode)"; exit 1; }

      - name: Fail when a required suite failed
        if: steps.candidate.outputs.skip == '0' && steps.suites.outputs.accepted != 'true'
        run: |
          echo "::error::a required suite failed against the integrated candidate"
          exit 1

  merge:
    name: merge
    # Ordered after the verification, but not gated on its conclusion. The queue is
    # the authority on whether a merge may happen, and it has the verdict: if the
    # candidate was refused it answers CANDIDATE_REJECTED, and if the profile never
    # asked for one it merges on the head proof. Gating here instead would make this
    # workflow a second, silent decision-maker — and a verification job that cannot
    # run would block the very merge that fixes it.
    needs: verify-candidate
    if: always() && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge under Thwip Queue authorization
        env:
          THWIP_ENDPOINT: https://thwip.recall.net
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ secrets.THWIP_ENQUEUE_TOKEN }}
          REPO_ID: ${{ github.event.repository.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          if [ -z "${MERGE_TOKEN:-}" ]; then
            echo "::notice::no merge token available; leaving the merge to a maintainer"
            exit 0
          fi

          # Resolve the pull request from the head commit the check ran on, so this
          # can never merge a different pull request than the one that was verified.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
                 --jq '[.[] | select(.state=="open")][0] // empty')
          if [ -z "$pr" ]; then
            echo "::notice::no open pull request for $HEAD_SHA"
            exit 0
          fi
          PR=$(printf '%s' "$pr" | jq -r .number)
          BASE_REF="refs/heads/$(printf '%s' "$pr" | jq -r .base.ref)"
          AUTHOR_ID=$(printf '%s' "$pr" | jq -r .user.id)
          DRAFT=$(printf '%s' "$pr" | jq -r .draft)
          echo "pull request #$PR onto $BASE_REF"

          oidc() {
            curl -sS -H "authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${THWIP_ENDPOINT}/api/github-actions" | jq -r .value
          }

          # Ask the queue again. Idempotent, and it is the queue — not this
          # workflow — that decides whether this pull request holds the turn.
          base_sha=$(printf '%s' "$pr" | jq -r .base.sha)
          merge_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.merge_commit_sha // empty')
          candidate='null'
          if [ -n "$merge_sha" ]; then
            commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge_sha" --jq '{tree:.tree.sha, parents:[.parents[].sha]}')
            candidate=$(jq -nc --arg base "$base_sha" --arg sha "$merge_sha" \
              --arg tree "$(printf '%s' "$commit" | jq -r .tree)" \
              --argjson parents "$(printf '%s' "$commit" | jq -c .parents)" \
              '{baseSha:$base, candidateSha:$sha, candidateTreeOid:$tree, parentShas:$parents}')
          fi

          body=$(jq -nc --argjson pr "$PR" --arg head "$HEAD_SHA" --arg base "$BASE_REF" \
            --arg author "$AUTHOR_ID" --argjson draft "$DRAFT" --argjson candidate "$candidate" \
            '{pullRequestNumber:$pr, headSha:$head, baseRef:$base, authorGithubUserId:$author, draft:$draft, proofAccepted:true, candidate:$candidate, prepare:true}')

          # The queue will not certify a merge until the required suites have run
          # against the integrated candidate, and the first ask is what starts that
          # run. So keep asking while it says the candidate is being verified: this
          # is the wait for the integration to be tested, not a retry of a failure.
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            out=$(curl -sS -w '\n%{http_code}' -X POST -H "authorization: Bearer $(oidc)" \
              -H "content-type: application/json" -d "$body" \
              "$THWIP_ENDPOINT/v1/queue/$REPO_ID/authorize" || true)
            code=$(printf '%s' "$out" | tail -n1); abody=$(printf '%s' "$out" | sed '$d')
            echo "authorize: http $code"; echo "$abody"
            [ "$code" = "200" ] || { echo "::error::authorize returned $code"; exit 1; }

            cand_state=$(printf '%s' "$abody" | jq -r '.candidate // empty')
            [ "$cand_state" = "verification-requested" ] || break

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::the candidate was still unverified after 30 minutes"
              exit 1
            fi
            sleep "$(printf '%s' "$abody" | jq -r '.retryAfterSeconds // 20')"
          done

          authorized=$(printf '%s' "$abody" | jq -r '.authorized // false')
          enforcing=$(printf '%s' "$abody" | jq -r '.enforcing // false')
          op=$(printf '%s' "$abody" | jq -r '.operationId // empty')
          if [ "$enforcing" != "true" ]; then
            echo "queue is observing; not merging"; exit 0
          fi
          if [ "$authorized" != "true" ] || [ -z "$op" ]; then
            echo "queue did not authorize a merge: $(printf '%s' "$abody" | jq -r .reason)"; exit 0
          fi

          # printf, so the trailer's blank line never appears literally in YAML.
          msg=$(printf 'Integrated by Thwip Queue.\n\nthwip-queue-operation: %s\n' "$op")
          resp=$(curl -sS -w '\n%{http_code}' -X PUT \
            -H "authorization: Bearer $MERGE_TOKEN" -H "accept: application/vnd.github+json" \
            -H "content-type: application/json" \
            -d "$(jq -nc --arg sha "$HEAD_SHA" --arg title "Merge pull request #$PR (Thwip Queue)" \
                  --arg msg "$msg" '{sha:$sha, merge_method:"merge", commit_title:$title, commit_message:$msg}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$PR/merge" || true)
          mcode=$(printf '%s' "$resp" | tail -n1); payload=$(printf '%s' "$resp" | sed '$d')
          echo "merge: http $mcode"
          if [ "$mcode" != "200" ]; then
            reason=$(printf '%s' "$payload" | jq -r '.message // "no message"')
            case "$mcode" in
              405|409|422)
                # A definite refusal. Tell the queue so the lane frees now rather
                # than waiting for a deadline and then needing an operator.
                curl -sS -o /dev/null -X POST -H "authorization: Bearer $(oidc)" \
                  -H "content-type: application/json" \
                  -d "$(jq -nc --arg base "$BASE_REF" --arg attempt "${op#merge_}" --arg op "$op" --arg detail "$mcode $reason" \
                        '{baseRef:$base, attemptId:$attempt, operationId:$op, detail:$detail}')" \
                  "$THWIP_ENDPOINT/v1/queue/$REPO_ID/not-merged" || true
                echo "::error::GitHub refused the merge ($mcode: $reason); the queue has released the lane"
                ;;
              *)
                # Anything unclear is left to reconciliation, never retried here.
                echo "::error::merge outcome unclear ($mcode: $reason); leaving it to reconciliation"
                ;;
            esac
            exit 1
          fi

          landed=$(printf '%s' "$payload" | jq -r .sha)
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$landed" --jq '{tree:.tree.sha, parents:[.parents[].sha]}')
          report=$(curl -sS -w '\n%{http_code}' -X POST -H "authorization: Bearer $(oidc)" \
            -H "content-type: application/json" \
            -d "$(jq -nc --arg base "$BASE_REF" --arg attempt "${op#merge_}" --arg op "$op" \
                  --arg sha "$landed" --arg tree "$(printf '%s' "$commit" | jq -r .tree)" \
                  --argjson parents "$(printf '%s' "$commit" | jq -c .parents)" \
                  '{baseRef:$base, attemptId:$attempt, operationId:$op, mergeSha:$sha, mergeTree:$tree, parentShas:$parents}')" \
            "$THWIP_ENDPOINT/v1/queue/$REPO_ID/merged" || true)
          echo "queue record: http $(printf '%s' "$report" | tail -n1)"
          printf '%s' "$report" | sed '$d'
