name: thwip-automerge

# Automatically add internal-team PRs to the merge queue. The only merge
# gate is the required thwip receipt check; once it is green the queue
# merges the PR without further human action.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enqueue:
    name: enqueue
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for internal team members
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          role=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission || echo "none")
          echo "author $AUTHOR permission: $role"
          case "$role" in
            admin|maintain|write)
              gh pr merge --auto --squash "$PR_URL"
              echo "auto-merge (merge queue) enabled for $PR_URL"
              ;;
            *)
              echo "author is not an internal team member; not enqueueing"
              ;;
          esac
