name: deploy staging

run-name: "deploy staging from ${{ github.sha }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after the evidence rehearsal"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: thwip-staging-deploy
  cancel-in-progress: false

jobs:
  verify-evidence:
    name: verify landed merge evidence
    runs-on: ubuntu-latest
    outputs:
      merge-kind: ${{ steps.evidence.outputs.merge_kind }}
      pull-request: ${{ steps.evidence.outputs.pull_request }}
      record-digest: ${{ steps.evidence.outputs.record_digest }}
      record-sequence: ${{ steps.evidence.outputs.record_sequence }}
      verified-sha: ${{ steps.evidence.outputs.verified_sha }}
    steps:
      # Keep the credential because the canonical-check step refetches main.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Confirm the exact canonical main checkout
        env:
          EXPECTED_REF: refs/heads/main
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
          actual=$(git rev-parse HEAD)
          canonical=$(git rev-parse refs/remotes/origin/main)
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$actual" = "$EXPECTED_SHA"
          test "$canonical" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          echo "canonical main: $actual"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages for the chain verifier
        run: pnpm -r --filter './packages/**' run build

      # A signed queue record is the deployment evidence for an App merge.
      - name: Verify the signed record for this landed SHA
        id: evidence
        env:
          THWIP_ENDPOINT: https://thwip.ai
        run: |
          set -euo pipefail
          for attempt in $(seq 1 41); do
            if pnpm thwip verify-chain \
              --repository-id "${{ github.event.repository.id }}" \
              --branch main \
              --expected-sha "${{ github.sha }}"; then
              exit 0
            fi
            if [ "$attempt" -eq 41 ]; then break; fi
            sleep 3
          done
          exit 1

      - name: Summarize the rehearsal
        if: always()
        env:
          DEPLOY_ENABLED: ${{ vars.THWIP_STAGING_DEPLOY_ENABLED }}
          KIND: ${{ steps.evidence.outputs.merge_kind }}
          OUTCOME: ${{ steps.evidence.outcome }}
          PR: ${{ steps.evidence.outputs.pull_request }}
          RECORD: ${{ steps.evidence.outputs.record_digest }}
          SEQUENCE: ${{ steps.evidence.outputs.record_sequence }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Staging deploy evidence"
            echo ""
            echo "- SHA: \`$SHA\`"
            echo "- Environment: staging"
            if [ "$OUTCOME" = "success" ]; then
              echo "- Merge record: $SEQUENCE, \`$RECORD\`"
              echo "- Evidence: $KIND for PR #$PR"
              echo "- Verification: passed"
            else
              echo "- Verification: ${OUTCOME:-not run}"
            fi
            if [ "$DEPLOY_ENABLED" = "true" ]; then
              echo "- Automatic deploy switch: enabled"
            else
              echo "- Automatic deploy switch: disabled; evidence rehearsal only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy and confirm staging
    needs: verify-evidence
    if: >-
      vars.THWIP_STAGING_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.deploy == true)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://thwip.ai/health
    steps:
      # Keep the credential so deployment can refetch main after approval.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Confirm Cloudflare configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then missing="${missing:+$missing, }CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::staging deploy configuration is missing: $missing"
            exit 1
          fi
          echo "Cloudflare staging deploy identity is configured."

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages for the chain verifier
        run: pnpm -r --filter './packages/**' run build

      # Approval may take time, so recheck the evidence before deployment.
      - name: Recheck the signed record for this landed SHA
        id: evidence
        env:
          THWIP_ENDPOINT: https://thwip.ai
        run: >-
          pnpm thwip verify-chain
          --repository-id "${{ github.event.repository.id }}"
          --branch main
          --expected-sha "${{ github.sha }}"

      - name: Build, gate, deploy, and confirm
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @thwip/control-plane run deploy:staging

      - name: Summarize the deployment
        if: always()
        env:
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          KIND: ${{ steps.evidence.outputs.merge_kind }}
          OUTCOME: ${{ steps.deploy.outcome }}
          PR: ${{ steps.evidence.outputs.pull_request }}
          RECORD: ${{ steps.evidence.outputs.record_digest }}
          SEQUENCE: ${{ steps.evidence.outputs.record_sequence }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Staging deployment"
            echo ""
            echo "- SHA: \`$SHA\`"
            echo "- Environment: staging"
            if [ "$EVIDENCE_OUTCOME" = "success" ]; then
              echo "- Merge record: $SEQUENCE, \`$RECORD\`"
              echo "- Evidence: $KIND for PR #$PR"
            else
              echo "- Evidence recheck: ${EVIDENCE_OUTCOME:-not run}"
            fi
            if [ "$OUTCOME" = "success" ]; then
              echo "- Confirmation: /health serves the exact SHA"
            else
              echo "- Confirmation: $OUTCOME"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
