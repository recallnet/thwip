name: thwip-release

run-name: "thwip: release from ${{ github.sha }}"

# Publish @recallnet/thwip when main gains something worth releasing.
#
# Nobody chooses the version. A breaking change is major and a feat is minor.
# Every other change to a shipped input is a patch, including a plain-language
# merge title. That default matters because the queue does not require
# Conventional Commit titles and silently skipped three real releases when this
# workflow did.
#
# Bumping, tagging and publishing live in one job on purpose. A tag pushed with
# GITHUB_TOKEN does not trigger another workflow, so splitting them would leave
# the tag sitting there with nothing publishing from it. That same property is
# what stops this re-triggering itself when it pushes the release commit.
on:
  push:
    branches: [main]
    # Only what ends up inside the CLI or Action, plus the release machinery
    # that decides and produces them.
    #
    # This ran on every push to main and cut a release from any commit that
    # looked releasable, so a change to the Worker published a new CLI that was
    # byte-identical to the last one. Two versions went out inside a minute that
    # way. The release planner independently derives the complete workspace
    # dependency closure, and its test keeps this trigger in step with it.
    paths:
      - "action.yml"
      - "packages/action/**"
      - "packages/cli/**"
      - "packages/policy/**"
      - "packages/protocol/**"
      - "packages/sshsig/**"
      - "packages/verifier/**"
      - "packages/prompts/**"
      - "packages/queue-domain/**"
      - "packages/queue-protocol/**"
      - "packages/vocabulary/**"
      - "scripts/build-npm.mjs"
      - "scripts/plan-cli-release.mjs"
      - ".github/workflows/thwip-release.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse everything up to the upload"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: thwip-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Configure the release registries
        id: github-packages
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/thwip-github-packages.npmrc"
          {
            echo "@recallnet:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=$GH_PACKAGES_TOKEN"
            echo "always-auth=true"
          } > "$config"
          chmod 0600 "$config"
          echo "path=$config" >> "$GITHUB_OUTPUT"

          npmjs_config="$RUNNER_TEMP/thwip-npmjs-read.npmrc"
          echo "registry=https://registry.npmjs.org" > "$npmjs_config"
          chmod 0600 "$npmjs_config"
          echo "npmjs_path=$npmjs_config" >> "$GITHUB_OUTPUT"

      - name: Work out whether this is a release, and what kind
        id: decide
        env:
          GITHUB_PACKAGES_NPMRC: ${{ steps.github-packages.outputs.path }}
          NPMJS_NPMRC: ${{ steps.github-packages.outputs.npmjs_path }}
        run: node scripts/plan-cli-release.mjs

      - name: Install
        if: steps.decide.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      # The CLI imports the workspace packages through their built entry points,
      # so they have to exist before the bundle can resolve them. Only those:
      # the bundler inlines packages and nothing else, and building the apps
      # here put the Worker's SPA and the Astro blog between a CLI fix and the
      # registry for no reason.
      - name: Build workspace packages
        if: steps.decide.outputs.release == 'true'
        run: pnpm -r --filter './packages/**' run build

      - name: Confirm generated release inputs were committed
        if: steps.decide.outputs.release == 'true'
        run: git diff --exit-code

      # The version travels in the environment. Writing it into
      # packages/cli/package.json first left the checkout dirty, and the build
      # stamp says so, so every published release claimed `<sha>-dirty` and
      # `thwip version` on a clean install from npm read like a local hack.
      - name: Build the package at the new version
        if: steps.decide.outputs.release == 'true'
        env:
          THWIP_RELEASE_VERSION: ${{ steps.decide.outputs.version }}
        run: node scripts/build-npm.mjs

      # Runs the built artifact rather than the source, so a bundle that cannot
      # start is caught here instead of by whoever installs it.
      #
      # From a packed tarball installed outside the repository, because that is
      # what an installer gets. Run in place, the bundle resolves any import
      # through the workspace's own node_modules, so a runtime dependency the
      # published package.json never declares starts fine here and fails on
      # every `npm install -g`.
      - name: Confirm the bundle runs the way it is installed
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail
          tarball=$(cd packages/cli/dist-npm && npm pack --silent)
          probe=$(mktemp -d)
          cp "packages/cli/dist-npm/$tarball" "$probe/"
          cd "$probe"
          npm init -y > /dev/null
          npm install --silent "./$tarball"
          ./node_modules/.bin/thwip --help > /dev/null
          ./node_modules/.bin/thwip version

      - name: Publish
        if: steps.decide.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance needs a public source repository. npm refuses the
          # attestation otherwise, with a 422 that arrives after the tarball is
          # built and signed. This turns itself on the day the repository opens.
          VISIBILITY: ${{ github.event.repository.visibility }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--access public)
          if [ "${VISIBILITY:-}" = "public" ]; then args+=(--provenance); fi
          if [ "${{ steps.decide.outputs.npm_exists }}" = "true" ]; then
            echo "npm already has this exact release; continuing the interrupted publication"
          elif [ "${DRY:-false}" = "true" ]; then
            echo "npm user: $(npm whoami 2>&1 || echo 'not authenticated')"
            npm publish packages/cli/dist-npm "${args[@]}" --dry-run
          else
            npm publish packages/cli/dist-npm "${args[@]}"
          fi

      - name: Publish the GitHub Packages mirror
        if: steps.decide.outputs.release == 'true'
        env:
          DRY: ${{ inputs.dry_run }}
          GITHUB_PACKAGES_NPMRC: ${{ steps.github-packages.outputs.path }}
        run: |
          set -euo pipefail
          if [ "${{ steps.decide.outputs.github_exists }}" = "true" ]; then
            echo "GitHub Packages already has this exact release; continuing the interrupted publication"
          elif [ "${DRY:-false}" = "true" ]; then
            npm publish packages/cli/dist-npm --access restricted \
              --registry=https://npm.pkg.github.com --userconfig="$GITHUB_PACKAGES_NPMRC" --dry-run
          else
            npm publish packages/cli/dist-npm --access restricted \
              --registry=https://npm.pkg.github.com --userconfig="$GITHUB_PACKAGES_NPMRC"
          fi

      - name: Confirm both installed releases
        if: steps.decide.outputs.release == 'true' && inputs.dry_run != true
        env:
          GITHUB_PACKAGES_NPMRC: ${{ steps.github-packages.outputs.path }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          config_dir=$(mktemp -d)
          npm_config="$config_dir/npmrc"
          echo "registry=https://registry.npmjs.org" > "$npm_config"

          confirm_install() {
            label=$1
            config=$2
            attempt=1
            max_attempts=18
            while [ "$attempt" -le "$max_attempts" ]; do
              probe=$(mktemp -d)
              if npm install --silent --prefix "$probe" --userconfig="$config" "@recallnet/thwip@$VERSION" &&
                 (cd "$probe" && ./node_modules/.bin/thwip version) | tee "$probe/version" &&
                 grep -F "thwip $VERSION" "$probe/version"; then
                echo "$label serves @recallnet/thwip@$VERSION"
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then break; fi
              echo "$label has not served the published release yet; retrying in 10 seconds"
              sleep 10
              attempt=$((attempt + 1))
            done
            echo "::error::$label did not serve @recallnet/thwip@$VERSION after $attempt attempts"
            return 1
          }

          confirm_install "npm" "$npm_config"
          confirm_install "GitHub Packages" "$GITHUB_PACKAGES_NPMRC"

      # Only once both registries have it. A tag naming a version that was never
      # published everywhere consumers resolve it is a lie the next run has to
      # work around.
      # Only a tag. Nothing is pushed to the branch.
      #
      # This used to commit the version bump to main, which a protected branch
      # cannot accept: a direct push carries no status checks, so GitHub rejects
      # it for the checks it is missing. The publish had already happened by
      # then, so npm moved and the tag did not — and because the next version was
      # derived from the file that never got committed, the pipeline computed an
      # already-published version and skipped, for good. It shipped nothing for a
      # day while reporting success.
      #
      # A tag is not covered by a branch rule, and the registry is the record of
      # what exists. The version in packages/cli/package.json is a floor the
      # release counts from if it is ever ahead of the registry; the build sets
      # the published version itself.
      - name: Record the release
        if: steps.decide.outputs.release == 'true' && inputs.dry_run != true
        env:
          V: ${{ steps.decide.outputs.version }}
          GIT_AUTHOR_NAME: thwip release
          GIT_AUTHOR_EMAIL: noreply@recall.network
          GIT_COMMITTER_NAME: thwip release
          GIT_COMMITTER_EMAIL: noreply@recall.network
        run: |
          set -euo pipefail
          git tag -a "v$V" -m "thwip $V"
          git push origin "v$V"
          echo "published and tagged v$V" >> "$GITHUB_STEP_SUMMARY"
