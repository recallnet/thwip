name: thwip-release

run-name: "thwip: release from ${{ github.sha }}"

# Publish the CLI and Action when their release inputs change.
on:
  push:
    branches: [main]
    paths:
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "action.yml"
      - "packages/action/**"
      - "packages/cli/**"
      - "packages/policy/**"
      - "packages/protocol/**"
      - "packages/sshsig/**"
      - "packages/verifier/**"
      - "packages/prompts/**"
      - "packages/queue-domain/**"
      - "packages/queue-protocol/**"
      - "packages/vocabulary/**"
      - "scripts/release.mjs"
      - ".github/workflows/thwip-release.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse everything up to the upload"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: thwip-release
  cancel-in-progress: false

env:
  # Numeric ID of the canonical release repository.
  THWIP_RELEASE_REPOSITORY_ID: ${{ vars.THWIP_RELEASE_REPOSITORY_ID }}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Configure npm reads
        id: npm
        run: |
          set -euo pipefail
          npmjs_config="$RUNNER_TEMP/thwip-npmjs-read.npmrc"
          {
            echo "registry=https://registry.npmjs.org"
            echo "@recallnet:registry=https://registry.npmjs.org"
          } > "$npmjs_config"
          chmod 0600 "$npmjs_config"
          echo "npmjs_path=$npmjs_config" >> "$GITHUB_OUTPUT"

      - name: Work out whether this is a release, and what kind
        id: decide
        env:
          NPMJS_NPMRC: ${{ steps.npm.outputs.npmjs_path }}
        run: node scripts/release.mjs plan

      - name: Install
        if: steps.decide.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        if: steps.decide.outputs.release == 'true'
        run: pnpm -r --filter './packages/**' run build

      - name: Confirm generated release inputs were committed
        if: steps.decide.outputs.release == 'true'
        run: git diff --exit-code

      - name: Build the package at the new version
        if: steps.decide.outputs.release == 'true'
        env:
          THWIP_RELEASE_VERSION: ${{ steps.decide.outputs.version }}
        run: node scripts/release.mjs package

      - name: Confirm the bundle runs the way it is installed
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail
          tarball=$(cd packages/cli/dist-npm && npm pack --silent)
          probe=$(mktemp -d)
          cp "packages/cli/dist-npm/$tarball" "$probe/"
          cd "$probe"
          npm init -y > /dev/null
          npm install --silent "./$tarball"
          ./node_modules/.bin/thwip --help > /dev/null
          ./node_modules/.bin/thwip version

      - name: Publish
        if: steps.decide.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VISIBILITY: ${{ github.event.repository.visibility }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--access public)
          if [ "${VISIBILITY:-}" = "public" ]; then args+=(--provenance); fi
          if [ "${{ steps.decide.outputs.npm_exists }}" = "true" ]; then
            echo "npm already has this exact release; continuing the interrupted publication"
          elif [ "${DRY:-false}" = "true" ]; then
            echo "npm user: $(npm whoami 2>&1 || echo 'not authenticated')"
            npm publish packages/cli/dist-npm "${args[@]}" --dry-run
          else
            npm publish packages/cli/dist-npm "${args[@]}"
          fi

      - name: Confirm the installed release
        if: steps.decide.outputs.release == 'true' && inputs.dry_run != true
        env:
          NPMJS_NPMRC: ${{ steps.npm.outputs.npmjs_path }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          confirm_install() {
            label=$1
            config=$2
            attempt=1
            max_attempts=18
            while [ "$attempt" -le "$max_attempts" ]; do
              probe=$(mktemp -d)
              if (cd "$probe" && npm install --userconfig="$config" --prefer-online \
                    --cache="$probe/.npm-cache" \
                    "@recallnet/thwip@$VERSION") &&
                 (cd "$probe" && ./node_modules/.bin/thwip version) | tee "$probe/version" &&
                 grep -F "thwip $VERSION" "$probe/version"; then
                echo "$label serves @recallnet/thwip@$VERSION"
                return 0
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then break; fi
              echo "$label has not served the published release yet; retrying in 10 seconds"
              sleep 10
              attempt=$((attempt + 1))
            done
            echo "::error::$label did not serve @recallnet/thwip@$VERSION after $attempt attempts"
            return 1
          }

          confirm_install "npm" "$NPMJS_NPMRC"

      # Record a tag only after the registry serves the release.
      - name: Record the release
        if: steps.decide.outputs.release == 'true' && inputs.dry_run != true
        env:
          V: ${{ steps.decide.outputs.version }}
          GIT_AUTHOR_NAME: thwip release
          GIT_AUTHOR_EMAIL: noreply@thwip.ai
          GIT_COMMITTER_NAME: thwip release
          GIT_COMMITTER_EMAIL: noreply@thwip.ai
        run: |
          set -euo pipefail
          git tag -a "v$V" -m "thwip $V"
          git push origin "v$V"
          echo "published and tagged v$V" >> "$GITHUB_STEP_SUMMARY"
