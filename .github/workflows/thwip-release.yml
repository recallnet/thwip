name: thwip-release

run-name: "thwip: release from ${{ github.sha }}"

# Publish @recallnet/thwip when main gains something worth releasing.
#
# Nobody chooses the version. The commit messages already say what changed, so
# the bump is derived from them: a breaking change is major, a feat is minor,
# anything else releasable is a patch, and a run that finds only docs or chores
# publishes nothing.
#
# Bumping, tagging and publishing live in one job on purpose. A tag pushed with
# GITHUB_TOKEN does not trigger another workflow, so splitting them would leave
# the tag sitting there with nothing publishing from it. That same property is
# what stops this re-triggering itself when it pushes the release commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse everything up to the upload"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: thwip-release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Work out whether this is a release, and what kind
        id: decide
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          range=${last:+$last..HEAD}
          echo "since ${last:-the beginning}"

          subjects=$(git log --format='%s' ${range:-HEAD})
          bodies=$(git log --format='%B' ${range:-HEAD})

          # A breaking change is either the ! marker or the footer. Both are
          # conventional, and accepting only one would ship a major change as a
          # patch without anyone noticing.
          if grep -qE '^[a-z]+(\(.+\))?!:' <<<"$subjects" || grep -q 'BREAKING CHANGE' <<<"$bodies"; then
            bump=major
          elif grep -qE '^feat(\(.+\))?:' <<<"$subjects"; then
            bump=minor
          elif grep -qE '^(fix|perf|refactor)(\(.+\))?:' <<<"$subjects"; then
            bump=patch
          else
            bump=none
          fi
          echo "bump=$bump"

          if [ "$bump" = "none" ]; then
            echo "nothing releasable since ${last:-the beginning}" >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Where to count from: whichever is further ahead, this file or the
          # registry.
          #
          # Deriving it from the file alone wedged the pipeline permanently. A
          # publish succeeded and the commit that records it did not, so the file
          # said 0.1.1 while npm had 0.2.0. Every run after that computed 0.2.0,
          # found it published, and gave up — for good, because nothing it skipped
          # ever moved the file forward. Releases reported success and shipped
          # nothing for a whole day.
          #
          # Taking the registry into account makes that self-healing: the next run
          # counts from what is actually out there and moves past it.
          declared=$(jq -r .version packages/cli/package.json)
          published=$(npm view "@recallnet/thwip" version 2>/dev/null || echo "0.0.0")
          current=$(node -e '
            const parse = (v) => v.split(".").map(Number);
            const [a, b] = [parse(process.argv[1]), parse(process.argv[2])];
            const ahead = a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] >= b[2];
            console.log(ahead ? process.argv[1] : process.argv[2]);
          ' "$declared" "$published")
          echo "declared=$declared published=$published counting from $current"

          next=$(node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const b = process.argv[2];
            console.log(b === "major" ? `${maj + 1}.0.0` : b === "minor" ? `${maj}.${min + 1}.0` : `${maj}.${min}.${pat + 1}`);
          ' "$current" "$bump")

          # Belt and braces. Counting from the registry should make this
          # unreachable, and if it ever fires again it is a bug rather than a
          # state to sit in, so it fails loudly instead of skipping quietly.
          if npm view "@recallnet/thwip@$next" version >/dev/null 2>&1; then
            echo "::error::@recallnet/thwip@$next is already published, but was computed as the next version. The release pipeline cannot proceed without a human deciding the version."
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "$bump: $current to $next" >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        if: steps.decide.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      # The CLI imports the workspace packages through their built entry points,
      # so they have to exist before the bundle can resolve them.
      - name: Build workspace packages
        if: steps.decide.outputs.release == 'true'
        run: pnpm build

      - name: Build the package at the new version
        if: steps.decide.outputs.release == 'true'
        run: |
          set -euo pipefail
          jq --arg v "${{ steps.decide.outputs.version }}" '.version = $v' packages/cli/package.json > /tmp/pkg.json
          mv /tmp/pkg.json packages/cli/package.json
          node scripts/build-npm.mjs

      # Runs the built artifact rather than the source, so a bundle that cannot
      # start is caught here instead of by whoever installs it.
      - name: Confirm the bundle runs
        if: steps.decide.outputs.release == 'true'
        run: node packages/cli/dist-npm/thwip.mjs --help > /dev/null

      - name: Publish
        if: steps.decide.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance needs a public source repository. npm refuses the
          # attestation otherwise, with a 422 that arrives after the tarball is
          # built and signed. This turns itself on the day the repository opens.
          VISIBILITY: ${{ github.event.repository.visibility }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args="--access public"
          if [ "${VISIBILITY:-}" = "public" ]; then args="$args --provenance"; fi
          if [ "${DRY:-false}" = "true" ]; then
            echo "npm user: $(npm whoami 2>&1 || echo 'not authenticated')"
            npm publish packages/cli/dist-npm $args --dry-run
          else
            npm publish packages/cli/dist-npm $args
          fi

      # Only once npm has it. A tag naming a version that was never published is
      # a lie the next run has to work around.
      - name: Record the release
        if: steps.decide.outputs.release == 'true' && inputs.dry_run != true
        env:
          V: ${{ steps.decide.outputs.version }}
          GIT_AUTHOR_NAME: thwip release
          GIT_AUTHOR_EMAIL: noreply@recall.network
          GIT_COMMITTER_NAME: thwip release
          GIT_COMMITTER_EMAIL: noreply@recall.network
        run: |
          set -euo pipefail
          git add packages/cli/package.json
          # Named as thwip's own, so the queue does not read its own release as
          # somebody merging around it and pause itself after every publish.
          git commit -m "$(printf 'release: @recallnet/thwip v%s\n\nthwip-automated: release\n' "$V")"
          git tag -a "v$V" -m "thwip $V"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$V"
          echo "published and tagged v$V" >> "$GITHUB_STEP_SUMMARY"
