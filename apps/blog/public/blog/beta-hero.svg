  <text x="80" y="100" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="600" fill="#1b1b1b">thwip beta</text>
  <text x="80" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#565c65">local run → signed proof → GitHub verify</text>
  <rect x="80" y="220" width="280" height="160" fill="#eceef0" stroke="#dfe1e2"/>
  <text x="100" y="280" font-family="ui-monospace, monospace" font-size="18" fill="#1b1b1b">1. thwip run</text>
  <text x="100" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#565c65">checks on your machine</text>
