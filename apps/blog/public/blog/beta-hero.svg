  <text x="900" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#565c65">merge on evidence</text>
  <text x="80" y="560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#71767a">thwip.recall.net · commit-carried CI evidence</text>
