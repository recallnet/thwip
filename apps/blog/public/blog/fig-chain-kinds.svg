<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Bar chart of the 57 records on this repository's merge chain by kind: 47 reused-proof merges, 5 candidate-verified merges, 4 external transitions, 1 base correction">
  <rect width="1200" height="470" fill="#ffffff"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">

    <text x="64" y="52" font-size="20" font-weight="700" fill="#1b1b1b">What the 57 records on this chain actually say</text>
    <text x="64" y="78" font-size="15" fill="#565c65">Every record signed and every link verified by node scripts/verify-chain.mjs 1315419165, run from outside thwip.</text>

    <!-- axis -->
    <g stroke="#dfe1e2" stroke-width="1">
      <line x1="380" y1="108" x2="380" y2="392"/>
      <line x1="530" y1="108" x2="530" y2="392"/>
      <line x1="680" y1="108" x2="680" y2="392"/>
      <line x1="830" y1="108" x2="830" y2="392"/>
      <line x1="980" y1="108" x2="980" y2="392"/>
      <line x1="1130" y1="108" x2="1130" y2="392"/>
    </g>
    <g font-size="13" fill="#71767a" text-anchor="middle">
      <text x="380" y="414">0</text>
      <text x="530" y="414">10</text>
      <text x="680" y="414">20</text>
      <text x="830" y="414">30</text>
      <text x="980" y="414">40</text>
      <text x="1130" y="414">50</text>
    </g>

    <!-- reused-proof-merge: 47 -->
    <text x="64" y="146" font-size="15" font-weight="600" fill="#1b1b1b">reused-proof-merge</text>
    <text x="64" y="166" font-size="13" fill="#565c65">Merged on the head's own proof.</text>
    <rect x="380" y="126" width="705" height="46" fill="#005ea2"/>
    <text x="1101" y="155" font-size="16" font-weight="700" fill="#1b1b1b">47</text>

    <!-- candidate-verified-merge: 5 -->
    <text x="64" y="216" font-size="15" font-weight="600" fill="#1b1b1b">candidate-verified-merge</text>
    <text x="64" y="236" font-size="13" fill="#565c65">The integrated candidate was tested first.</text>
    <rect x="380" y="196" width="75" height="46" fill="#00436d"/>
    <text x="471" y="225" font-size="16" font-weight="700" fill="#1b1b1b">5</text>

    <!-- external-transition: 4 -->
    <text x="64" y="286" font-size="15" font-weight="600" fill="#1b1b1b">external-transition</text>
    <text x="64" y="306" font-size="13" fill="#565c65">The base moved and thwip did not certify it.</text>
    <rect x="380" y="266" width="60" height="46" fill="#b50909"/>
    <text x="456" y="295" font-size="16" font-weight="700" fill="#1b1b1b">4</text>

    <!-- base-correction: 1 -->
    <text x="64" y="356" font-size="15" font-weight="600" fill="#1b1b1b">base-correction</text>
    <text x="64" y="376" font-size="13" fill="#565c65">A record named a sha the branch did not take.</text>
    <rect x="380" y="336" width="15" height="46" fill="#565c65"/>
    <text x="411" y="365" font-size="16" font-weight="700" fill="#1b1b1b">1</text>

    <text x="64" y="446" font-size="14" fill="#565c65">The four red records are the merges of 2 August. No signed intent pinned the trees that landed, so no merge record could honestly cover them.</text>
  </g>
</svg>
