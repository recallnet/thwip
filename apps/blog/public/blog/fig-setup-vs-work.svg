<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Bar chart comparing 36 seconds of environment rebuild plus 24 seconds of suites in GitHub Actions against 4.5 seconds of suites on the edge machine">
  <rect width="1200" height="460" fill="#ffffff"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">

    <text x="64" y="52" font-size="20" font-weight="700" fill="#1b1b1b">Where the time goes on one verification of this repository</text>
    <text x="64" y="78" font-size="15" fill="#565c65">Seconds. Actions step medians across 18 successful candidate verifications; edge timings are the median across 168 signed proofs.</text>

    <!-- annotation over the rebuild span: 0s to 36s -->
    <g>
      <text x="385" y="110" font-size="13" font-weight="600" fill="#b50909" text-anchor="middle">36s rebuilding state the edge machine already holds</text>
      <line x1="64" y1="120" x2="707" y2="120" stroke="#b50909" stroke-width="2"/>
      <line x1="64" y1="114" x2="64" y2="126" stroke="#b50909" stroke-width="2"/>
      <line x1="707" y1="114" x2="707" y2="126" stroke="#b50909" stroke-width="2"/>
    </g>

    <!-- axis: 0..60s over x 64..1136, 17.87px per second -->
    <g stroke="#dfe1e2" stroke-width="1">
      <line x1="64" y1="350" x2="1136" y2="350"/>
      <line x1="64" y1="136" x2="64" y2="350"/>
      <line x1="243" y1="136" x2="243" y2="350"/>
      <line x1="421" y1="136" x2="421" y2="350"/>
      <line x1="600" y1="136" x2="600" y2="350"/>
      <line x1="779" y1="136" x2="779" y2="350"/>
      <line x1="957" y1="136" x2="957" y2="350"/>
      <line x1="1136" y1="136" x2="1136" y2="350"/>
    </g>
    <g font-size="13" fill="#71767a" text-anchor="middle">
      <text x="64" y="374">0s</text>
      <text x="243" y="374">10s</text>
      <text x="421" y="374">20s</text>
      <text x="600" y="374">30s</text>
      <text x="779" y="374">40s</text>
      <text x="957" y="374">50s</text>
      <text x="1136" y="374">60s</text>
    </g>

    <!-- Actions row: 5 setup, 14 install, 17 build, 24 suites -->
    <text x="64" y="156" font-size="15" font-weight="600" fill="#1b1b1b">GitHub Actions, clean checkout of the candidate</text>
    <rect x="64"  y="168" width="89"  height="46" fill="#dfe1e2"/>
    <rect x="153" y="168" width="250" height="46" fill="#c3ccd4"/>
    <rect x="403" y="168" width="304" height="46" fill="#8f9ba7"/>
    <rect x="707" y="168" width="429" height="46" fill="#005ea2"/>
    <g font-size="13" text-anchor="middle">
      <text x="278" y="197" fill="#1b1b1b">install 14s</text>
      <text x="555" y="197" fill="#ffffff">build 17s</text>
      <text x="921" y="197" fill="#ffffff">suites 24s</text>
    </g>
    <text x="108" y="236" font-size="12" fill="#565c65" text-anchor="middle">setup 5s</text>

    <!-- Edge row -->
    <text x="64" y="276" font-size="15" font-weight="600" fill="#1b1b1b">Edge machine, dependencies and build output already present</text>
    <rect x="64" y="288" width="80" height="46" fill="#005ea2"/>
    <text x="160" y="317" font-size="13" fill="#1b1b1b">suites 4.5s median</text>

    <text x="64" y="424" font-size="14" fill="#565c65">The edge run reuses an installed dependency tree and existing build output. Reconstituting those is what the cloud pays for.</text>
  </g>
</svg>
