<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Install checklist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#1b1b1b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="630" fill="#005ea2"/>
  <text x="72" y="88" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#7eb6e8" letter-spacing="0.12em">SETUP</text>
  <text x="72" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="700" fill="#ffffff">From zero to a signed proof</text>
  <text x="72" y="200" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#a8b0ba">CLI · device login · GitHub signing key · thwip run</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
    <rect x="72" y="260" width="1056" height="64" fill="#1e252d" stroke="#3d4654" stroke-width="2"/>
    <text x="100" y="300" fill="#5dca6a">$</text>
    <text x="132" y="300" fill="#ffffff">npm install -g @recallnet/thwip</text>
    <rect x="72" y="340" width="1056" height="64" fill="#1e252d" stroke="#3d4654" stroke-width="2"/>
    <text x="100" y="380" fill="#5dca6a">$</text>
    <text x="132" y="380" fill="#ffffff">thwip login</text>
    <rect x="72" y="420" width="1056" height="64" fill="#1e252d" stroke="#3d4654" stroke-width="2"/>
    <text x="100" y="460" fill="#5dca6a">$</text>
    <text x="132" y="460" fill="#ffffff">thwip keys status   # Signing Key on GitHub</text>
    <rect x="72" y="500" width="1056" height="64" fill="#1e252d" stroke="#3d4654" stroke-width="2"/>
    <text x="100" y="540" fill="#5dca6a">$</text>
    <text x="132" y="540" fill="#ffffff">thwip init &amp;&amp; thwip run</text>
  </g>
</svg>
